<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Card Esgotado</title>
  </head>
  <body>
    <article class="card">
      <div class="card_media">
        <img
          src="https://picsum.photos/seed/tenis/600/440"
          alt="Foto do produto"
        />

        <span class="etiqueta">Promoção</span>

        <button class="favorito" aria-label="Salvar no favoritos">♥</button>

        <div class="faixa__sombra"></div>

        <div class="faixa">
          <h2 class="faixa__titulo">Tênis Corrida Leve</h2>
        </div>
        <spam class="selo">Esgotado</spam>
        <dev class="card__info">
          <p class="cad__preco">R$ 249 <span>R$ 399</span></p>
        </dev>
      </div>
    </article>
  </body>
</html>
